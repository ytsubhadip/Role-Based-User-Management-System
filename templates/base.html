<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RBAC System{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="brand-icon">R</div>
            <span>RBAC Management</span>
        </a>
        <div class="nav-user" id="navUserSection" style="display: none;">
            <div class="user-info">
                <div class="user-name" id="navUserName">User</div>
                <span class="user-role-badge" id="navUserRole">ROLE</span>
            </div>
            <button class="btn btn-secondary btn-sm" id="navLogoutBtn" onclick="handleGlobalLogout()">Logout</button>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script>
        async function checkSession() {
            try {
                const res = await fetch("/me");
                if (res.ok) {
                    const user = await res.json();
                    const section = document.getElementById("navUserSection");
                    const name = document.getElementById("navUserName");
                    const badge = document.getElementById("navUserRole");
                    if (section && name && badge) {
                        section.style.display = "flex";
                        name.textContent = user.full_name;
                        badge.textContent = user.role.toUpperCase();
                        badge.className = `user-role-badge role-${user.role}`;
                    }
                    return user;
                }
            } catch (e) {
                console.error("Session check error", e);
            }
            return null;
        }

        async function handleGlobalLogout() {
            try {
                await fetch("/logout", { method: "POST" });
            } finally {
                window.location.href = "/login";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Only check session on dashboard/authenticated pages
            if (window.location.pathname.includes("dashboard")) {
                checkSession().then(user => {
                    if (!user) {
                        window.location.href = "/login";
                    }
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
